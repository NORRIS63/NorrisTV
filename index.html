<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Norris TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
overflow-x:hidden;
}

/* HEADER */

.header{
position:sticky;
top:0;
z-index:9999;
background:linear-gradient(to bottom,#000,#111);
padding:12px 15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.logo{
font-size:28px;
font-weight:bold;
color:#e50914;
letter-spacing:1px;
}

/* SEARCH */

.search-box{
width:180px;
}

.search-box input{

width:100%;
padding:10px 14px;

border:none;
outline:none;

border-radius:30px;

background:#1c1c1c;
color:white;

font-size:14px;

}

/* PLAYER */

.player-box{
position:sticky;
top:63px;
z-index:9998;
background:#0b0b0b;
padding:0 10px 10px 10px;
overflow:hidden;
border-radius:24px;
margin-top:0;
}

/* VIDEO */

video{
width:100%;
height:250px;
display:block;
background:black;
border-radius:22px;
object-fit:cover;
overflow:hidden;
}

/* CONTROLS */

.custom-controls{

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

display:flex;
gap:12px;

z-index:999;

opacity:0;
transition:.3s;

}

.control-btn{

width:58px;
height:58px;

border:none;
border-radius:50%;

background:rgba(229,9,20,.9);

color:white;

font-size:22px;

display:flex;
justify-content:center;
align-items:center;

cursor:pointer;

backdrop-filter:blur(10px);

}

/* NOW PLAYING */

.now-playing{
padding:12px 15px;
font-size:17px;
font-weight:bold;
color:#fff;
}

/* GROUP TABS */

.group-tabs{
display:flex;
overflow-x:auto;
gap:10px;
padding:12px 10px;
position:sticky;
top:305px;
background:#0b0b0b;
z-index:9997;
border-top:1px solid #161616;
margin-top:-5px;
}


.group-tabs::-webkit-scrollbar{
display:none;
}

.group-tab{

background:#1a1a1a;
border:1px solid #333;

color:white;

padding:8px 14px;

border-radius:30px;

cursor:pointer;

white-space:nowrap;

font-size:14px;

transition:.3s;

}

.active-tab{

background:#e50914;
border-color:#e50914;

}

/* CHANNEL GRID */

.channel-grid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(115px,1fr));

gap:14px;

padding:15px;

}

/* CHANNEL CARD */

.channel{

position:relative;

background:#161616;

border-radius:18px;

overflow:hidden;

cursor:pointer;

transition:.25s;

border:2px solid transparent;

}

.channel:hover{
transform:scale(1.04);
}

.channel img{

width:100%;
height:90px;

object-fit:contain;

background:white;

padding:8px;

}

.channel-name{

padding:8px;

font-size:12px;
font-weight:bold;

text-align:center;

min-height:42px;

display:flex;
align-items:center;
justify-content:center;

}

/* ACTIVE */

.active{

border:2px solid #00ff84;

box-shadow:
0 0 18px rgba(0,255,132,.7);

}

/* FAVORITE */

.fav-btn{

position:absolute;

top:8px;
right:8px;

width:28px;
height:28px;

border-radius:50%;

background:rgba(0,0,0,.7);

display:flex;
justify-content:center;
align-items:center;

font-size:15px;

z-index:5;

}

/* FOOTER */

.footer{

text-align:center;

padding:20px;

font-size:13px;

color:#888;

}

/* MOBILE */
@media(max-width:768px){

.logo{
font-size:23px;
}

.search-box{
width:130px;
}

video{
height:220px;
border-radius:18px;
display:block;
}

.group-tabs{
top:325px;
}

.channel-grid{
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.channel img{
height:75px;
}

.channel-name{
font-size:11px;
padding:6px;
}

.control-btn{
width:50px;
height:50px;
font-size:18px;
}

video{
height:320px;
max-height:45vh;
border-radius:24px;
object-fit:cover;

}

/* TV / DESKTOP MODE */
@media(min-width:900px){

.player-box{
max-width:1400px;
margin:auto;
padding:15px 20px;
}

video{
height:500px;
border-radius:28px;
object-fit:cover;
}

.group-tabs{
top:360px;
padding:14px 12px;
justify-content:flex-start;
gap:10px;
overflow-x:auto;
overflow-y:hidden;
}

.group-tab{
font-size:18px;
padding:12px 22px;
border-radius:40px;
}

.channel-grid{
grid-template-columns:repeat(6,1fr);
gap:22px;
padding:20px 30px;
}

.channel{
border-radius:24px;
}

.channel img{
height:130px;
padding:12px;
}

.channel-name{
font-size:16px;
padding:12px;
min-height:60px;
}

.logo{
font-size:40px;
}

.search-box{
width:320px;
}

.search-box input{
font-size:18px;
padding:14px 18px;
}

}

.logo{
font-size:23px;
}

.search-box{
width:130px;
}

video{
height:220px;
border-radius:18px;
display:block;
overflow:hidden;
}

.group-tabs{
top:325px;
}

.channel-grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(130px,1fr));
gap:16px;
padding:15px;
}

/* TV / DESKTOP MODE */
@media(min-width:900px){

.player-box{
max-width:1400px;
margin:auto;
padding:15px 20px;
}

video{
height:500px;
border-radius:28px;
object-fit:cover;
}

.group-tabs{
top:620px;
padding:14px 20px;
justify-content:center;
gap:14px;
}

.group-tab{
font-size:18px;
padding:12px 22px;
border-radius:40px;
}

.channel-grid{
grid-template-columns:
repeat(6,1fr);
gap:22px;
padding:20px 30px;
}

.channel{
border-radius:24px;
}

.channel img{
height:130px;
padding:12px;
}

.channel-name{
font-size:16px;
padding:12px;
min-height:60px;
}

.logo{
font-size:40px;
}

.search-box{
width:320px;
}

.search-box input{
font-size:18px;
padding:14px 18px;
}

.channel img{
height:75px;
}

.channel-name{
font-size:11px;
padding:6px;
}

.control-btn{
width:50px;
height:50px;
font-size:18px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">Norris TV</div>

<div class="search-box">

<input type="text"
id="search"
placeholder="Search..."
onkeyup="searchChannels()">

</div>

</div>

<!-- PLAYER -->

<div class="player-box">

<video id="video"
autoplay
playsinline
controls>

</video>

<div class="custom-controls">

<button class="control-btn"
onclick="prevChannel()">

⏮

</button>

<button class="control-btn"
onclick="togglePlay()">

⏯

</button>

<button class="control-btn"
onclick="nextChannel()">

⏭

</button>

</div>

</div>

<div class="now-playing"
id="nowPlaying">

Select a Channel

</div>

<!-- GROUPS -->

<div class="group-tabs"
id="groupTabs">

</div>

<!-- CHANNELS -->

<div class="channel-grid"
id="channelGrid">

</div>

<div class="footer">

© 2026 Norris TV

</div>

<script>

/* PLAYLIST */

const playlist =
'https://raw.githubusercontent.com/NORRIS63/NorrisTV/refs/heads/main/playlist.m3u';

let channels = [];
let filteredChannels = [];
let currentIndex = 0;
let currentGroup='All';

let favorites =
JSON.parse(localStorage.getItem('favorites') || '[]');

/* LOAD PLAYLIST */

fetch(playlist)

.then(r=>r.text())

.then(data=>{

const lines =
data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info = lines[i];
const url = lines[i+1];
const name = info.split(',')[1];

let logo='';

const match =
info.match(/tvg-logo="(.*?)"/);

if(match){logo=match[1];}

let group='Other';

const g=
info.match(/group-title="(.*?)"/i);

if(g){group=g[1];}

channels.push({
name,
url,
logo,
group
});

}

}

buildTabs();

filteredChannels = channels;

renderChannels();

if(channels.length>0){
playChannel(0);
}

});

/* GROUP NORMALIZE */

function normalizeGroup(g){

g=(g||'').toLowerCase();

if(g.includes('sport'))
return 'Sports';

if(g.includes('news'))
return 'News';

if(g.includes('movie'))
return 'Movies';

if(g.includes('kid'))
return 'Kids';

if(g.includes('music'))
return 'Music';

if(g.includes('bangla'))
return 'Bangla';

if(g.includes('english'))
return 'English';

return 'Others';

}

/* BUILD TABS */

function buildTabs(){

const tabs =
document.getElementById('groupTabs');

const groups = [

'All',
'❤️ Favorites',
'Bangla',
'Sports',
'News',
'Movies',
'Kids',
'Music',
'English',
'Others'

];

tabs.innerHTML =

groups.map(g=>`

<button class="group-tab
${g==='All'?'active-tab':''}"

onclick="filterGroup('${g}',this)">

${g}

</button>

`).join('');

}

/* FILTER */

function filterGroup(group,btn){

currentGroup=group;

document.querySelectorAll('.group-tab')
.forEach(x=>
x.classList.remove('active-tab'));

btn.classList.add('active-tab');

if(group==='All'){

filteredChannels=channels;

}

else if(group==='❤️ Favorites'){

filteredChannels =
channels.filter(c=>
favorites.includes(c.url));

}

else{

filteredChannels =
channels.filter(c=>
normalizeGroup(c.group)===group);

}

renderChannels();

}

/* RENDER */

function renderChannels(){

const grid =
document.getElementById('channelGrid');

grid.innerHTML='';

filteredChannels.forEach((ch,index)=>{

const div =
document.createElement('div');

div.className='channel';

const fav =
favorites.includes(ch.url)
? '❤️' : '🤍';

div.innerHTML=`

<div class="fav-btn">
${fav}
</div>

<img src="${ch.logo}"
onerror="this.src='https://via.placeholder.com/150'">

<div class="channel-name">
${ch.name}
</div>

`;

div.onclick=()=>
playChannel(channels.indexOf(ch));

/* FAVORITE */

const favBtn =
div.querySelector('.fav-btn');

favBtn.addEventListener('click',function(e){

e.stopPropagation();

if(favorites.includes(ch.url)){

favorites =
favorites.filter(x=>x!==ch.url);

}else{

favorites.push(ch.url);

}

localStorage.setItem(
'favorites',
JSON.stringify(favorites)
);

renderChannels();

});

grid.appendChild(div);

});

}

/* PLAY */

function playChannel(index){

currentIndex=index;

const video =
document.getElementById('video');

const channel =
channels[index];

document.getElementById('nowPlaying')
.innerText =
'Now Playing: ' + channel.name;

if(Hls.isSupported()){

const hls =
new Hls();

hls.loadSource(channel.url);

hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

});

}

else{

video.src=channel.url;
video.play();

}

document.querySelectorAll('.channel')
.forEach(el=>
el.classList.remove('active'));

const cards =
document.querySelectorAll('.channel');

cards.forEach((card,i)=>{

if(
filteredChannels[i] &&
filteredChannels[i].url === channel.url
){

card.classList.add('active');

}

});

}

/* NEXT */

function nextChannel(){

currentIndex++;

if(currentIndex>=channels.length){

currentIndex=0;

}

playChannel(currentIndex);

}

/* PREV */

function prevChannel(){

currentIndex--;

if(currentIndex<0){

currentIndex=
channels.length-1;

}

playChannel(currentIndex);

}

/* PLAY PAUSE */

function togglePlay(){

const video =
document.getElementById('video');

if(video.paused){

video.play();

}else{

video.pause();

}

}

/* SEARCH */

function searchChannels(){

const input =

document.getElementById('search')
.value.toLowerCase();

const cards =
document.querySelectorAll('.channel');

filteredChannels.forEach((ch,index)=>{

if(
ch.name.toLowerCase()
.includes(input)
){

cards[index]
.style.display='block';

}

else{

cards[index]
.style.display='none';

}

});

}

/* AUTO HIDE CONTROLS */

const controls =
document.querySelector('.custom-controls');

function showUI(){

controls.style.opacity='1';

setTimeout(()=>{

controls.style.opacity='0';

},2000);

}

showUI();

document.querySelector('.player-box')
.addEventListener('click',()=>{

showUI();

});

</script>

</body>
</html>
