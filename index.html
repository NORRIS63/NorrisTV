<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norris TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
  :root {
    --red: #e5091a;
    --red-dim: rgba(229,9,26,0.15);
    --red-glow: rgba(229,9,26,0.45);
    --bg: #080808;
    --surface: #111111;
    --surface2: #181818;
    --surface3: #202020;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f0;
    --muted: #777;
    --green: #00ff84;
    --green-glow: rgba(0,255,132,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Subtle grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.6;
  }

  /* ─── HEADER ─────────────────────────────── */
  .header {
    position: sticky;
    top: 0;
    z-index: 500;
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    color: var(--text);
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .logo span {
    color: var(--red);
  }

  .logo-dot {
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    display: inline-block;
    animation: pulse-dot 2s ease-in-out infinite;
    box-shadow: 0 0 10px var(--red-glow);
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Search */
  .search-wrap {
    position: relative;
  }

  .search-wrap i {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }

  .search-wrap input {
    width: 200px;
    padding: 9px 14px 9px 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, width 0.3s;
  }

  .search-wrap input:focus {
    border-color: rgba(229,9,26,0.4);
    width: 240px;
  }

  .search-wrap input::placeholder { color: var(--muted); }

  /* ─── PLAYER SECTION ─────────────────────── */
  .player-section {
    position: relative;
    background: #000;
  }

  .player-inner {
    position: relative;
    max-width: 1600px;
    margin: 0 auto;
  }

  #video {
    width: 100%;
    height: 55vw;
    max-height: 480px;
    min-height: 220px;
    display: block;
    background: #000;
    object-fit: cover;
  }

  /* Gradient fade bottom of video */
  .player-fade {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 120px;
    background: linear-gradient(to top, var(--bg), transparent);
    pointer-events: none;
  }

  /* Now playing overlay */
  .now-playing-bar {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
  }

  .now-playing-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .np-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-badge {
    background: var(--red);
    color: white;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 2px 7px;
    border-radius: 3px;
  }

  .np-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    line-height: 1;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    color: #fff;
  }

  /* Player nav buttons */
  .player-nav {
    pointer-events: all;
    display: flex;
    gap: 8px;
  }

  .nav-btn {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    color: white;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .nav-btn:hover {
    background: var(--red);
    border-color: var(--red);
  }

  /* ─── TABS ───────────────────────────────── */
  .tabs-bar {
    position: sticky;
    top: 64px;
    z-index: 400;
    background: rgba(8,8,8,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs-bar::-webkit-scrollbar { display: none; }

  .tabs-inner {
    display: flex;
    gap: 0;
    padding: 0 16px;
    min-width: max-content;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 14px 16px;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
    transition: color 0.2s;
    letter-spacing: 0.3px;
  }

  .tab-btn::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%; right: 50%;
    height: 2px;
    background: var(--red);
    transition: left 0.2s, right 0.2s;
    border-radius: 2px 2px 0 0;
  }

  .tab-btn.active {
    color: var(--text);
  }

  .tab-btn.active::after {
    left: 16px;
    right: 16px;
  }

  .tab-btn:hover:not(.active) { color: #ccc; }

  /* ─── CHANNEL GRID ───────────────────────── */
  .grid-section {
    padding: 20px 16px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    padding-left: 2px;
  }

  .channel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }

  /* ─── CHANNEL CARD ───────────────────────── */
  .channel-card {
    position: relative;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: transform 0.2s cubic-bezier(.2,.8,.3,1), border-color 0.2s, box-shadow 0.2s;
    animation: card-in 0.3s ease both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .channel-card:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }

  .channel-card.active {
    border-color: var(--green);
    box-shadow: 0 0 0 1px var(--green), 0 0 20px var(--green-glow);
  }

  .channel-logo-wrap {
    position: relative;
    background: white;
    aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .channel-logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
    transition: transform 0.25s;
  }

  .channel-card:hover .channel-logo-wrap img {
    transform: scale(1.06);
  }

  /* Fav button */
  .fav-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    cursor: pointer;
    z-index: 5;
    border: none;
    transition: transform 0.15s;
  }

  .fav-btn:hover { transform: scale(1.2); }

  /* Playing indicator */
  .playing-indicator {
    position: absolute;
    top: 6px;
    left: 6px;
    display: none;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
  }

  .channel-card.active .playing-indicator { display: flex; }

  .bar {
    width: 3px;
    background: var(--green);
    border-radius: 2px;
    animation: eq 0.8s ease-in-out infinite alternate;
  }

  .bar:nth-child(1) { height: 6px; animation-delay: 0s; }
  .bar:nth-child(2) { height: 10px; animation-delay: 0.15s; }
  .bar:nth-child(3) { height: 14px; animation-delay: 0.3s; }

  @keyframes eq {
    from { transform: scaleY(0.4); }
    to { transform: scaleY(1); }
  }

  .channel-name {
    padding: 8px 8px 9px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    line-height: 1.3;
    min-height: 36px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ─── EMPTY STATE ────────────────────────── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state i {
    font-size: 36px;
    margin-bottom: 12px;
    display: block;
    opacity: 0.4;
  }

  .empty-state p { font-size: 14px; }

  /* ─── LOADING SKELETON ───────────────────── */
  .skeleton {
    background: var(--surface2);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .skeleton-img {
    aspect-ratio: 16/9;
    background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  .skeleton-text {
    height: 36px;
    margin: 8px;
    background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ─── FOOTER ─────────────────────────────── */
  .footer {
    text-align: center;
    padding: 24px 20px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    letter-spacing: 0.5px;
  }

  .footer strong { color: var(--red); font-weight: 500; }

  /* ─── CHANNEL COUNT BADGE ────────────────── */
  .count-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface3);
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    margin-left: 6px;
    min-width: 22px;
    letter-spacing: 0;
  }

  /* ─── RESPONSIVE ─────────────────────────── */
  @media (max-width: 480px) {
    .logo { font-size: 26px; }
    .search-wrap input { width: 150px; }
    .search-wrap input:focus { width: 160px; }
    #video { max-height: 240px; }
    .np-name { font-size: 20px; }
    .channel-grid { grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .grid-section { padding: 14px 12px 40px; }
  }

  @media (min-width: 768px) {
    .channel-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
    .grid-section { padding: 24px 24px 60px; }
    .search-wrap input { width: 240px; }
  }

  @media (min-width: 1200px) {
    #video { max-height: 600px; }
    .channel-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .grid-section { padding: 28px 32px 80px; }
    .logo { font-size: 38px; }
    .tab-btn { font-size: 14px; padding: 16px 20px; }
  }

  @media (min-width: 1600px) {
    .channel-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>

<!-- ─── HEADER ─── -->
<header class="header">
  <div class="logo">
    <span class="logo-dot"></span>
    Norris<span>TV</span>
  </div>
  <div class="header-right">
    <div class="search-wrap">
      <i class="fa fa-search"></i>
      <input type="text" id="search" placeholder="Search channels…" oninput="searchChannels()">
    </div>
  </div>
</header>

<!-- ─── PLAYER ─── -->
<div class="player-section">
  <div class="player-inner">
    <video id="video" autoplay playsinline controls></video>
    <div class="player-fade"></div>
    <div class="now-playing-bar">
      <div class="now-playing-info">
        <div class="np-label">
          <span class="live-badge">LIVE</span>
          Now Playing
        </div>
        <div class="np-name" id="nowPlaying">Select a Channel</div>
      </div>
      <div class="player-nav">
        <button class="nav-btn" onclick="prevChannel()" title="Previous"><i class="fa fa-backward-step"></i></button>
        <button class="nav-btn" onclick="togglePlay()" title="Play/Pause"><i class="fa fa-play" id="playIcon"></i></button>
        <button class="nav-btn" onclick="nextChannel()" title="Next"><i class="fa fa-forward-step"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- ─── TABS ─── -->
<nav class="tabs-bar">
  <div class="tabs-inner" id="groupTabs"></div>
</nav>

<!-- ─── GRID ─── -->
<section class="grid-section">
  <div class="section-label" id="sectionLabel">All Channels</div>
  <div class="channel-grid" id="channelGrid">
    <!-- skeleton loaders -->
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
  </div>
</section>

<footer class="footer">© 2026 <strong>Norris TV</strong> — All streams are provided for informational purposes</footer>

<script>
const PLAYLIST_URL = 'https://raw.githubusercontent.com/NORRIS63/NorrisTV/refs/heads/main/playlist.m3u';

let channels = [];
let filteredChannels = [];
let currentIndex = 0;
let currentGroup = 'All';
let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
let hlsInstance = null;

const GROUPS = ['All', '❤️ Favorites', 'Bangla', 'Sports', 'News', 'Movies', 'Kids', 'Music', 'English', 'Others'];

function normalizeGroup(g) {
  g = (g || '').toLowerCase();
  if (g.includes('sport'))   return 'Sports';
  if (g.includes('news'))    return 'News';
  if (g.includes('movie'))   return 'Movies';
  if (g.includes('kid'))     return 'Kids';
  if (g.includes('music'))   return 'Music';
  if (g.includes('bangla'))  return 'Bangla';
  if (g.includes('english')) return 'English';
  return 'Others';
}

/* ── LOAD PLAYLIST ── */
fetch(PLAYLIST_URL)
  .then(r => r.text())
  .then(data => {
    const lines = data.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('#EXTINF')) {
        const info = lines[i];
        const url  = (lines[i+1] || '').trim();
        if (!url || url.startsWith('#')) continue;

        const nameMatch  = info.split(',')[1];
        const logoMatch  = info.match(/tvg-logo="(.*?)"/);
        const groupMatch = info.match(/group-title="(.*?)"/i);

        channels.push({
          name:  (nameMatch  || 'Unknown').trim(),
          url,
          logo:  logoMatch  ? logoMatch[1]  : '',
          group: groupMatch ? groupMatch[1] : 'Other'
        });
      }
    }
    buildTabs();
    filteredChannels = channels;
    renderChannels();
    if (channels.length > 0) playChannel(0);
  })
  .catch(() => {
    document.getElementById('channelGrid').innerHTML =
      '<div class="empty-state"><i class="fa fa-triangle-exclamation"></i><p>Could not load playlist</p></div>';
  });

/* ── BUILD TABS ── */
function buildTabs() {
  const container = document.getElementById('groupTabs');
  const counts = {};
  counts['All'] = channels.length;
  counts['❤️ Favorites'] = favorites.length;
  GROUPS.slice(2).forEach(g => {
    counts[g] = channels.filter(c => normalizeGroup(c.group) === g).length;
  });

  container.innerHTML = GROUPS.map((g, i) => `
    <button class="tab-btn ${i === 0 ? 'active' : ''}" onclick="filterGroup('${g.replace(/'/g,"\\'")}', this)">
      ${g}<span class="count-badge">${counts[g] || 0}</span>
    </button>
  `).join('');
}

/* ── FILTER GROUP ── */
function filterGroup(group, btn) {
  currentGroup = group;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const label = document.getElementById('sectionLabel');

  if (group === 'All') {
    filteredChannels = channels;
    label.textContent = `All Channels`;
  } else if (group === '❤️ Favorites') {
    filteredChannels = channels.filter(c => favorites.includes(c.url));
    label.textContent = 'Favorites';
  } else {
    filteredChannels = channels.filter(c => normalizeGroup(c.group) === group);
    label.textContent = group;
  }
  renderChannels();
}

/* ── RENDER CHANNELS ── */
function renderChannels() {
  const grid = document.getElementById('channelGrid');
  grid.innerHTML = '';

  if (filteredChannels.length === 0) {
    grid.innerHTML = '<div class="empty-state"><i class="fa fa-tv"></i><p>No channels in this category</p></div>';
    return;
  }

  filteredChannels.forEach((ch, idx) => {
    const isActive = channels[currentIndex] && channels[currentIndex].url === ch.url;
    const isFav    = favorites.includes(ch.url);

    const card = document.createElement('div');
    card.className = 'channel-card' + (isActive ? ' active' : '');
    card.dataset.url = ch.url;

    card.innerHTML = `
      <div class="channel-logo-wrap">
        <div class="playing-indicator">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <button class="fav-btn" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">${isFav ? '❤️' : '🤍'}</button>
        <img src="${ch.logo || ''}" alt="${ch.name}"
          onerror="this.style.display='none';this.parentNode.style.background='#1a1a1a'">
      </div>
      <div class="channel-name">${ch.name}</div>
    `;

    card.addEventListener('click', () => playChannel(channels.indexOf(ch)));

    card.querySelector('.fav-btn').addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(ch.url);
    });

    card.style.animationDelay = (idx % 30) * 20 + 'ms';
    grid.appendChild(card);
  });
}

/* ── TOGGLE FAV ── */
function toggleFav(url) {
  if (favorites.includes(url)) {
    favorites = favorites.filter(x => x !== url);
  } else {
    favorites.push(url);
  }
  localStorage.setItem('favorites', JSON.stringify(favorites));

  // Update fav counts in tabs
  buildTabs();
  // Re-activate correct tab
  const tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(b => {
    if (b.textContent.trim().startsWith(currentGroup.trim())) {
      b.classList.add('active');
    }
  });
  renderChannels();
}

/* ── PLAY ── */
function playChannel(index) {
  currentIndex = index;
  const video = document.getElementById('video');
  const ch = channels[index];
  if (!ch) return;

  document.getElementById('nowPlaying').textContent = ch.name;
  document.getElementById('playIcon').className = 'fa fa-pause';

  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

  if (Hls.isSupported()) {
    hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
    hlsInstance.loadSource(ch.url);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  } else {
    video.src = ch.url;
    video.play().catch(() => {});
  }

  // Update active card
  document.querySelectorAll('.channel-card').forEach(card => {
    card.classList.toggle('active', card.dataset.url === ch.url);
  });
}

/* ── NAV ── */
function nextChannel() {
  currentIndex = (currentIndex + 1) % channels.length;
  playChannel(currentIndex);
}

function prevChannel() {
  currentIndex = (currentIndex - 1 + channels.length) % channels.length;
  playChannel(currentIndex);
}

function togglePlay() {
  const video = document.getElementById('video');
  const icon  = document.getElementById('playIcon');
  if (video.paused) {
    video.play();
    icon.className = 'fa fa-pause';
  } else {
    video.pause();
    icon.className = 'fa fa-play';
  }
}

/* ── SEARCH ── */
function searchChannels() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  if (!q) {
    filteredChannels = currentGroup === 'All' ? channels :
      currentGroup === '❤️ Favorites' ? channels.filter(c => favorites.includes(c.url)) :
      channels.filter(c => normalizeGroup(c.group) === currentGroup);
  } else {
    const base = currentGroup === 'All' ? channels :
      currentGroup === '❤️ Favorites' ? channels.filter(c => favorites.includes(c.url)) :
      channels.filter(c => normalizeGroup(c.group) === currentGroup);
    filteredChannels = base.filter(c => c.name.toLowerCase().includes(q));
  }
  renderChannels();
}
</script>
