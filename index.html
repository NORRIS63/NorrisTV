<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norris TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#141414;
color:white;
overflow-x:hidden;
}

/* Header */

header{
position:sticky;
top:0;
z-index:999;
background:linear-gradient(to bottom,#000,rgba(0,0,0,.5));
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
color:#e50914;
}

.search{
width:220px;
padding:10px 15px;
border:none;
border-radius:30px;
background:#2a2a2a;
color:white;
outline:none;
}

/* Player */

.player-wrapper{
padding:15px;
}

video{
width:100%;
height:55vh;
background:black;
border-radius:16px;
object-fit:cover;
}

.now-playing{
font-size:22px;
font-weight:bold;
margin-top:12px;
}

/* Categories */

.section{
padding:15px;
}

.section-title{
font-size:22px;
margin-bottom:12px;
font-weight:bold;
}

/* Channel cards */

.channel-row{
display:flex;
overflow-x:auto;
gap:14px;
scroll-behavior:smooth;
padding-bottom:10px;
}

.channel-row::-webkit-scrollbar{
display:none;
}

.channel-card{
min-width:140px;
background:#222;
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.25s;
flex-shrink:0;
}

.channel-card:hover{
transform:scale(1.08);
}

.channel-card img{
width:100%;
height:100px;
object-fit:contain;
background:white;
padding:8px;
}

.channel-info{
padding:10px;
}

.channel-name{
font-size:15px;
font-weight:bold;
}

.group-name{
font-size:12px;
color:#aaa;
margin-top:4px;
}

/* Mobile */

@media(max-width:768px){

.search{
width:140px;
font-size:14px;
}

video{
height:32vh;
}

.channel-card{
min-width:120px;
}

.channel-card img{
height:85px;
}

.logo{
font-size:22px;
}

.now-playing{
font-size:18px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">Norris TV</div>
<input type="text" class="search" id="search" placeholder="Search channels">
</header>

<div class="player-wrapper">
<video id="video" controls autoplay></video>
<div class="now-playing" id="nowPlaying">
Select a channel
</div>
</div>

<div id="categories"></div>

<script>

const playlistURL = "https://raw.githubusercontent.com/NORRIS63/NorrisTV/main/playlist.m3u";

const video =
document.getElementById("video");

const nowPlaying =
document.getElementById("nowPlaying");

const categoriesDiv =
document.getElementById("categories");

const searchInput =
document.getElementById("search");

let channels = [];

fetch(playlistURL)
.then(res=>res.text())
.then(data=>{
parseM3U(data);
renderCategories(channels);
});

function parseM3U(data){

const lines =
data.split("\n");

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith("#EXTINF")){

const info = lines[i];
const url =
lines[i+1]?.trim();

const name =
info.split(",").pop().trim();

const logo =
info.match(/tvg-logo="(.*?)"/);

const group =
info.match(/group-title="(.*?)"/);

channels.push({
name,
url,
logo: logo ? logo[1] : "",
group: group ? group[1] : "Others"
});
}
}
}

function renderCategories(list){

categoriesDiv.innerHTML = "";

const grouped = {};

list.forEach(channel=>{

if(!grouped[channel.group]){
grouped[channel.group] = [];
}

grouped[channel.group].push(channel);

});

Object.keys(grouped)
.forEach(group=>{

const section =
document.createElement("div");

section.className =
"section";

const title =
document.createElement("div");

title.className =
"section-title";

title.innerText = group;

const row =
document.createElement("div");

row.className =
"channel-row";

grouped[group]
.forEach(ch=>{

const card =
document.createElement("div");

card.className =
"channel-card";

card.innerHTML = `
<img src="${ch.logo}"
onerror="this.src='https://via.placeholder.com/150'">

<div class="channel-info">
<div class="channel-name">
${ch.name}
</div>

<div class="group-name">
${ch.group}
</div>
</div>
`;

card.addEventListener("click",()=>{

playChannel(ch.url,ch.name);

});

row.appendChild(card);

});

section.appendChild(title);
section.appendChild(row);

categoriesDiv
.appendChild(section);

});

}

function playChannel(url,name){

if(Hls.isSupported()){

const hls =
new Hls();

hls.loadSource(url);
hls.attachMedia(video);

}else{

video.src=url;

}

nowPlaying.innerText =
"Now Playing: " + name;

video.play();

}

searchInput
.addEventListener("input",()=>{

const value =
searchInput.value
.toLowerCase();

const filtered =
channels.filter(c=>
c.name.toLowerCase()
.includes(value)
);

renderCategories(filtered);

});
</script>

</body>
</html>
